<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Our Solar System</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030308;
            --orbit-color: rgba(255, 255, 255, 0.12);
            --orbit-hover: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a0a1a 0%, var(--bg-color) 100%);
            color: white;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Titles and Text */
        .ui-container {
            position: absolute;
            top: 4vh;
            width: 100%;
            text-align: center;
            z-index: 200;
            pointer-events: none;
        }
        
        h1 {
            margin: 0;
            font-size: 5vmin;
            background: linear-gradient(90deg, #ff8a00, #e52e71, #9b2deb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            filter: drop-shadow(0px 0px 15px rgba(229, 46, 113, 0.4));
        }

        p {
            margin: 8px 0 0 0;
            font-size: 2vmin;
            color: #b3b3ff;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Starfield */
        #universe {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; box-shadow: none; }
            50% { opacity: 1; box-shadow: 0 0 6px white; }
        }

        /* System Container */
        .solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 95vmin;
            height: 95vmin;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Orbits */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--orbit-size);
            height: var(--orbit-size);
            border: 1px dashed var(--orbit-color);
            border-radius: 50%;
            animation: spin var(--speed) linear infinite;
            pointer-events: none; 
            transition: border-color 0.4s, box-shadow 0.4s;
        }

        /* Planet Wrappers */
        .planet-wrapper {
            position: absolute;
            top: 0;
            left: 50%;
            width: var(--size-w, var(--size));
            height: var(--size-h, var(--size));
            animation: anti-spin var(--anti-speed) linear infinite;
            pointer-events: auto; 
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Planet Images */
        .planet {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 50%;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.8); /* Creates a realistic shadow on the dark side */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s;
        }

        /* Saturn specific fixes to remove the black box */
        .saturn .planet {
            background-size: 100% 100%;
            box-shadow: none;
            /* This pure CSS mask softly fades out the black edges of the JPEG, creating seamless transparency */
            -webkit-mask-image: radial-gradient(ellipse at center, black 62%, transparent 72%);
            mask-image: radial-gradient(ellipse at center, black 62%, transparent 72%);
        }

        /* Planet Names */
        .planet-name {
            position: absolute;
            top: calc(100% + 8px);
            color: #fff;
            padding: 4px 12px;
            font-size: 1.8vmin;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 4px #000, 0 0 8px #000, 0 0 15px #9b2deb;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            white-space: nowrap;
        }

        /* Interactivity / Hover States */
        body:has(.planet-wrapper:hover) .orbit,
        body:has(.planet-wrapper:hover) .planet-wrapper,
        body:has(.sun-wrapper:hover) .orbit,
        body:has(.sun-wrapper:hover) .planet-wrapper {
            animation-play-state: paused;
        }

        .orbit:has(.planet-wrapper:hover) {
            border-color: var(--orbit-hover);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15) inset, 0 0 25px rgba(255, 255, 255, 0.15);
        }

        .planet-wrapper:hover, .sun-wrapper:hover {
            z-index: 100;
        }

        .planet-wrapper:hover .planet, .sun-wrapper:hover .planet {
            transform: scale(1.6);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        .planet-wrapper:hover .planet-name, .sun-wrapper:hover .planet-name {
            opacity: 1;
            transform: translateY(5px);
        }

        /* Animations */
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes anti-spin {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        /* ==== CELESTIAL BODIES DATA ==== */
        .sun-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12vmin; height: 12vmin;
            cursor: pointer;
            pointer-events: auto;
            z-index: 20;
            display: flex; justify-content: center; align-items: center;
        }
        .sun {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg');
            box-shadow: 0 0 40px #ff7300, 0 0 80px #ff2a00 inset;
            border-radius: 50%;
        }

        .mercury-orbit { --orbit-size: 19vmin; --speed: 8s; z-index: 9; }
        .mercury-wrapper { --size: 2vmin; --anti-speed: 8s; }
        .mercury .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/3/30/Mercury_in_color_-_Prockter07_centered.jpg'); }

        .venus-orbit { --orbit-size: 28vmin; --speed: 12s; z-index: 8; }
        .venus-wrapper { --size: 3.5vmin; --anti-speed: 12s; }
        .venus .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg'); } /* Fixed Venus URL! */

        .earth-orbit { --orbit-size: 39vmin; --speed: 16s; z-index: 7; }
        .earth-wrapper { --size: 4vmin; --anti-speed: 16s; }
        .earth .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg'); }

        .moon-orbit { --orbit-size: 7vmin; --speed: 3s; border-color: rgba(255,255,255,0.05); }
        .moon-wrapper { --size: 1.2vmin; --anti-speed: 3s; }
        .moon .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg'); box-shadow: none; }

        .mars-orbit { --orbit-size: 50vmin; --speed: 24s; z-index: 6; }
        .mars-wrapper { --size: 3vmin; --anti-speed: 24s; }
        .mars .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg'); }

        .jupiter-orbit { --orbit-size: 65vmin; --speed: 36s; z-index: 5; }
        .jupiter-wrapper { --size: 7vmin; --anti-speed: 36s; }
        .jupiter .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg'); }

        .saturn-orbit { --orbit-size: 79vmin; --speed: 48s; z-index: 4; }
        .saturn-wrapper { --size-w: 12vmin; --size-h: 6vmin; --anti-speed: 48s; }
        .saturn .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg'); }

        .uranus-orbit { --orbit-size: 89vmin; --speed: 60s; z-index: 3; }
        .uranus-wrapper { --size: 4.5vmin; --anti-speed: 60s; }
        .uranus .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/3/3d/Uranus2.jpg'); }

        .neptune-orbit { --orbit-size: 98vmin; --speed: 76s; z-index: 2; }
        .neptune-wrapper { --size: 4vmin; --anti-speed: 76s; }
        .neptune .planet { background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/63/Neptune_-_Voyager_2_%2829347980845%29_flatten_crop.jpg'); }
    </style>
</head>
<body>

    <div id="universe"></div>
    
    <div class="ui-container">
        <h1>Our Solar System</h1>
        <p>Hover over the planets to stop time!</p>
    </div>

    <div class="solar-system">
        
        <div class="sun-wrapper">
            <div class="planet sun"></div>
            <div class="planet-name">The Sun</div>
        </div>

        <div class="orbit mercury-orbit">
            <div class="planet-wrapper mercury-wrapper mercury">
                <div class="planet"></div>
                <div class="planet-name">Mercury</div>
            </div>
        </div>

        <div class="orbit venus-orbit">
            <div class="planet-wrapper venus-wrapper venus">
                <div class="planet"></div>
                <div class="planet-name">Venus</div>
            </div>
        </div>

        <div class="orbit earth-orbit">
            <div class="planet-wrapper earth-wrapper earth">
                <div class="planet"></div>
                <div class="planet-name">Earth</div>
                <div class="orbit moon-orbit">
                    <div class="planet-wrapper moon-wrapper moon">
                        <div class="planet"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="orbit mars-orbit">
            <div class="planet-wrapper mars-wrapper mars">
                <div class="planet"></div>
                <div class="planet-name">Mars</div>
            </div>
        </div>

        <div class="orbit jupiter-orbit">
            <div class="planet-wrapper jupiter-wrapper jupiter">
                <div class="planet"></div>
                <div class="planet-name">Jupiter</div>
            </div>
        </div>

        <div class="orbit saturn-orbit">
            <div class="planet-wrapper saturn-wrapper saturn">
                <div class="planet"></div>
                <div class="planet-name">Saturn</div>
            </div>
        </div>

        <div class="orbit uranus-orbit">
            <div class="planet-wrapper uranus-wrapper uranus">
                <div class="planet"></div>
                <div class="planet-name">Uranus</div>
            </div>
        </div>

        <div class="orbit neptune-orbit">
            <div class="planet-wrapper neptune-wrapper neptune">
                <div class="planet"></div>
                <div class="planet-name">Neptune</div>
            </div>
        </div>

    </div>

    <script>
        const universe = document.getElementById('universe');
        const starCount = 350;

        for (let i = 0; i < starCount; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            
            let size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            star.style.animationDuration = (Math.random() * 4 + 2) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            
            universe.appendChild(star);
        }
    </script>
</body>
</html>
